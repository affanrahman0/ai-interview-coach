version: '3.8'

services:
  # 1. The Database Container
  db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ai_interviewer
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. The Backend Container
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # This overrides the local database URL in your .env so it connects to the Docker database!
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/ai_interviewer
    volumes:
      - ./backend:/app
    depends_on:
      - db

  # 3. The Frontend Container
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
